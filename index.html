<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>:
    <link rel="stylesheet" href="header.css">
</head>
<body>
    <!-- BẮT ĐẦU HEADER -->
<header class="header">
    <!-- Logo bên trái -->
    <div class="logo">
        <a href="#">
            <img src="images/logo.png" alt="EduPress Logo">
        </a>
    </div>

    <!-- Menu ở giữa -->
    <nav class="main-menu">
        <ul>
            <li><a href="#" class="active">Home</a></li>
            <li><a href="#">Pages</a></li>
            <li><a href="#">Courses</a></li>
            <li><a href="#">Features</a></li>
            <li><a href="#">Blog</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- Khu vực nút bấm bên phải -->
    <div class="header-actions">
        <!-- Nút tìm kiếm -->
        <button class="search-btn">Search</button>
        <a href="#" class="login-link">Login / Register</a>
    </div>
</header>

<!-- BẮT ĐẦU NỘI DUNG CHÍNH -->
<main>
    <!-- 1. Phần Hero (Banner to có hình cô gái) -->
    <section class="hero-section"></section>

    <!-- 2. Phần Danh mục hàng đầu (Top Categories) -->
    <section class="categories-section"></section>

    <!-- 3. Phần Khóa học nổi bật (Featured Courses) -->
    <section class="courses-section"></section>

    <!-- Các section tiếp theo (Banner quảng cáo, Thống kê, Phản hồi học viên, v.v.) -->
    <!-- Mình sẽ bổ sung dần khi bạn code tới phần đó -->
</main>

<!-- BẮT ĐẦU FOOTER (Chân trang) -->
<footer class="footer">
    <!-- Thông tin liên hệ, logo dưới cùng -->
</footer>
</body>
</html>
