<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewpSort" content="width=device-width, initial-scale=1.0">
    <title>TEST</title>
    <style>
    .cs-page{
        max-width: 1440px;
        margin: 0 auto;
        --orange: #FF782D;
        --black: #000000;
        --gray-bg: #F5F5F5;
        --text: #555555;
        --soft-text: #9D9D9D;
        --border:#000000;
        color: var(--text);
        background-color: #ffffff;
        font-size: clamp(14px, 1.4vw, 16px);
    }
    .header {
        width: 100%;
        height: 3.62%;
    }
    .header-inner {
        width: 67.2%;
        height: 100%;
        margin: 0 auto;
    
        display: flex;
        align-items: center;
    }

.logo-header {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo-icon-header {
    width: 39.3px;
    height: 30px;
}

.logo-icon-header img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.nav {
    display: flex;
    align-items: center;
    gap: 0.2vw;
    margin-left: auto;
    margin-right: 8.67%;
}
.header-right {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-left: 30px;
}
@media (max-width: 900px){
    .nav {
        display: none;
    }
}
    </style>
</head>
<body class="cs-page">
    <!-- HEADER -->
    <header class="header">
        <div class="header-inner">
            <a href="" class="logo-header">
                <div class="logo-icon-header">
                    <img src="../src/assets/images/banners/Logo.svg" alt="EduPress Logo">
                </div>
                <span>EduPress</span>
            </a>

            <nav class="nav">
                <a href="#">Home</a>
                <a href="#" class="active">Course</a>
                <a href="#">Blog</a>
                <a href="#">Page</a>
                <a href="#">LearnPress Add-On</a>
                <a href="#">Premium Theme</a>
            </nav>

            <div class="header-right">
                <a href="" class="btn-login">Login / Register</a>
                <div class="search-icon">

                </div>
            </div>
        </div>
     </header>
</body>
</html>
